name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.4.0)'
        required: false
        type: string

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Validate and extract version
        id: check
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
            if [ -z "$VERSION" ]; then
              VERSION="1.4.0"
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
          fi

  build:
    needs: validate-tag
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: amd64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.13'
          cache: 'pip'
          architecture: ${{ matrix.arch == 'x86' && 'x86' || matrix.arch == 'arm64' && 'arm64' || 'x64' }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-${{ matrix.arch }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-ccache-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Build with Nuitka
        env:
          CCACHE_DIR: ~/.ccache
        shell: bash
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"
          # Fallback to 1.0.0 if not provided just for building
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          PYTHONPATH=src python -m nuitka --assume-yes-for-downloads --file-version=$VERSION --product-version=$VERSION main.py

      - name: Package for Linux
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh

      - name: Package for Windows
        if: runner.os == 'Windows'
        run: .\scripts\build_windows.ps1 -VERSION "${{ needs.validate-tag.outputs.version }}" -ARCH "${{ matrix.arch }}"

      - name: Package for macOS
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zesec-${{ matrix.os }}-${{ matrix.arch }}-artifacts
          path: dist/*
          retention-days: 7

  release:
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release to GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag_name }}
          files: artifacts/*
          generate_release_notes: true