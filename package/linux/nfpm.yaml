name: "zesec"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "default"
priority: "extra"
replaces:
  - zesec
provides:
  - zesec
maintainer: "Lahiru Dilhara"
description: "Zesec - Secure file encryption and cleaning tool"
vendor: "Lahiru Dilhara"
homepage: "https://github.com/LahiruDilhara/zesec"
license: "MIT"
contents:
  - src: "../../zesec"
    dst: "/opt/zesec/zesec"
  - src: "/opt/zesec/zesec"
    dst: "/usr/local/bin/zesec"
    type: "symlink"
  - src: "./com.lahirudilhara.zesec.desktop"
    dst: "/usr/share/applications/com.lahirudilhara.zesec.desktop"
  - src: "../../assets/icon/icon.png"
    dst: "/opt/zesec/icon.png"
